              errors.append(f"missing {dt_mk}")

          # fixup 关 FTRACE 后 tracepoint 桩不存在；若 olddefconfig 仍留 SCHEDSTATS=y 会炸 stats.h:60
          stats_h = root / "kernel/sched/stats.h"
          if stats_h.is_file():
              text = stats_h.read_text()
              orig = text
              marker = "/* redwood: trace_sched_stat_* requires CONFIG_FTRACE */"
              if marker in text:
                  print("[=] stats.h: trace_sched_stat FTRACE guard already present")
              else:
                  old_block = (
                      "\t/* Force schedstat enabled if a dependent tracepoint is active */\n"
                      "\tif (trace_sched_stat_wait_enabled()    ||\n"
                      "\t    trace_sched_stat_sleep_enabled()   ||\n"
                      "\t    trace_sched_stat_iowait_enabled()  ||\n"
                      "\t    trace_sched_stat_blocked_enabled() ||\n"
                      "\t    trace_sched_stat_runtime_enabled())\n"
                      "\t\tprintk_deferred_once(\"Scheduler tracepoints stat_sleep, stat_iowait, stat_blocked and stat_runtime require the kernel parameter schedstats=enable or kernel.sched_schedstats=1\\n\");"
                  )
                  new_block = (
                      "\t/* Force schedstat enabled if a dependent tracepoint is active */\n"
                      f"\t{marker}\n"
                      "#ifdef CONFIG_FTRACE\n"
                      "\tif (trace_sched_stat_wait_enabled()    ||\n"
                      "\t    trace_sched_stat_sleep_enabled()   ||\n"
                      "\t    trace_sched_stat_iowait_enabled()  ||\n"
                      "\t    trace_sched_stat_blocked_enabled() ||\n"
                      "\t    trace_sched_stat_runtime_enabled())\n"
                      "\t\tprintk_deferred_once(\"Scheduler tracepoints stat_sleep, stat_iowait, stat_blocked and stat_runtime require the kernel parameter schedstats=enable or kernel.sched_schedstats=1\\n\");\n"
                      "#endif"
                  )
                  if old_block not in text:
                      errors.append("stats.h: check_schedstat_required trace block not found")
                  else:
                      text = text.replace(old_block, new_block, 1)
                      stats_h.write_text(text)
                      print("[+] stats.h: wrapped trace_sched_stat_* checks in CONFIG_FTRACE")
              if stats_h.is_file() and marker not in stats_h.read_text():
                  errors.append("stats.h: FTRACE guard patch failed")
          else:
              errors.append(f"missing {stats_h}")

          # Scarlet 把 shrinker_list 的锁重构成 shrinker_rwlock，但 #ifdef CONFIG_MEMCG 块内
          # 操作 shrinker_idr 的代码（prealloc/unregister_memcg_shrinker、shrink_slab_memcg）
          # 仍用 shrinker_rwsem 且声明被误删 → 开 MEMCG 即报 undeclared。该路径持锁期间会睡眠
          # （do_shrink_slab），必须用可睡眠的 rwsem，故补回声明而非改成自旋的 rwlock。
          vmscan = root / "mm/vmscan.c"
          if vmscan.is_file():
              text = vmscan.read_text()
              decl = "static DECLARE_RWSEM(shrinker_rwsem);"
              anchor = "static DEFINE_RWLOCK(shrinker_rwlock);"
              if decl in text:
                  print("[=] vmscan.c: shrinker_rwsem already declared")
              elif "shrinker_rwsem" not in text:
                  print("[=] vmscan.c: no shrinker_rwsem reference (nothing to fix)")
              elif anchor in text:
                  text = text.replace(anchor, anchor + "\n" + decl, 1)
                  vmscan.write_text(text)
                  print("[+] vmscan.c: re-declared shrinker_rwsem for MEMCG idr block")
              else:
                  errors.append("vmscan.c: cannot find shrinker_rwlock anchor for shrinker_rwsem decl")
          else:
              errors.append(f"missing {vmscan}")

          # Scarlet blk-mq-sched.h 已改为 3 参 try_insert_merge，mq-deadline.c 仍 2 参 → stock 开 MQ_IOSCHED_DEADLINE 必炸
          mq_deadline = root / "block/mq-deadline.c"
          if mq_deadline.is_file():
              text = mq_deadline.read_text()
              marker = "/* redwood: blk_mq_sched_try_insert_merge free list */"
              if marker in text:
                  print("[=] mq-deadline.c: try_insert_merge free-list patch already present")
              elif not re.search(r"blk_mq_sched_try_insert_merge\s*\(\s*q\s*,\s*rq\s*\)", text):
                  if re.search(r"blk_mq_sched_try_insert_merge\s*\(\s*q\s*,\s*rq\s*,\s*free\s*\)", text):
                      print("[=] mq-deadline.c: try_insert_merge already uses 3-arg API")
                  else:
                      errors.append("mq-deadline.c: blk_mq_sched_try_insert_merge call pattern not found")
              else:
                  new_text, n_sig = re.subn(
                      r"(static void dd_insert_request\(struct blk_mq_hw_ctx \*hctx, struct request \*rq,\s+bool at_head)\)",
                      r"\1, struct list_head *free)",
                      text,
                      count=1,
                  )
                  if n_sig != 1:
                      errors.append("mq-deadline.c: dd_insert_request signature not found")
                  else:
                      new_text, n_call = re.subn(
                          r"if \(blk_mq_sched_try_insert_merge\(q, rq\)\)\s*\n\s*return;",
                          f"{marker}\n\tif (blk_mq_sched_try_insert_merge(q, rq, free))\n\t\treturn;",
                          new_text,
                          count=1,
                      )
                      if n_call != 1:
                          errors.append("mq-deadline.c: 2-arg blk_mq_sched_try_insert_merge call not found")
                      else:
                          new_text, n_ins = re.subn(
                              r"(struct deadline_data \*dd = q->elevator->elevator_data;\s*)"
                              r"(\n\s*spin_lock\(&dd->lock\);\s*while \(!list_empty\(list\)\) \{.*?"
                              r"list_del_init\(&rq->queuelist\);\s*)"
                              r"dd_insert_request\(hctx, rq, at_head\);(\s*\}\s*"
                              r"spin_unlock\(&dd->lock\);\s*)"
                              r"(\})",
                              r"\1LIST_HEAD(free);\2dd_insert_request(hctx, rq, at_head, &free);\3"
                              r"blk_mq_free_requests(&free);\n\4",
                              new_text,
                              count=1,
                              flags=re.DOTALL,
                          )
                          if n_ins != 1:
                              errors.append("mq-deadline.c: dd_insert_requests block not found")
                          else:
                              mq_deadline.write_text(new_text)
                              print("[+] mq-deadline.c: pass free list to blk_mq_sched_try_insert_merge")
              if mq_deadline.is_file() and marker not in mq_deadline.read_text():
                  if not re.search(
                      r"blk_mq_sched_try_insert_merge\s*\(\s*q\s*,\s*rq\s*,\s*free\s*\)",
                      mq_deadline.read_text(),
                  ):
                      errors.append("mq-deadline.c: try_insert_merge free-list patch failed")
          else:
              errors.append(f"missing {mq_deadline}")

          # fixup 关 FTRACE 但 stock 仍开 EVENT_TRACING → CREATE_TRACE_POINTS 编译 binder_trace.h
          # 其 TP_printk 引用 binder_{command,return}_strings，而 Scarlet 仅在 CONFIG_FTRACE 下定义
          binder_c = root / "drivers/android/binder.c"
          if binder_c.is_file():
              text = binder_c.read_text()
              marker = "/* redwood: binder string tables always visible for EVENT_TRACING */"
              if marker in text:
                  print("[=] binder.c: binder string table FTRACE guard already removed")
              elif "#ifdef CONFIG_FTRACE\nstatic const char *const binder_return_strings[]" not in text:
                  if "static const char *const binder_return_strings[]" in text:
                      print("[=] binder.c: binder string tables already unconditional")
                  else:
                      errors.append("binder.c: binder_return_strings definition not found")
              else:
                  text = text.replace(
                      "#ifdef CONFIG_FTRACE\nstatic const char *const binder_return_strings[]",
                      f"{marker}\nstatic const char *const binder_return_strings[]",
                      1,
                  )
                  old_tail = '"BC_REPLY_SG",\n};\n#endif\n\n#ifdef CONFIG_ANDROID_BINDER_LOGS'
                  new_tail = '"BC_REPLY_SG",\n};\n\n#ifdef CONFIG_ANDROID_BINDER_LOGS'
                  if old_tail not in text:
                      errors.append("binder.c: binder_command_strings CONFIG_FTRACE endif anchor not found")
                  else:
                      text = text.replace(old_tail, new_tail, 1)
                      binder_c.write_text(text)
                      print("[+] binder.c: expose binder_command/return string tables without CONFIG_FTRACE")
              if binder_c.is_file():
                  body = binder_c.read_text()
                  if marker not in body and re.search(
                      r"#ifdef CONFIG_FTRACE\s*\nstatic const char \*const binder_return_strings",
                      body,
                  ):
                      errors.append("binder.c: binder string table FTRACE guard patch failed")
          else:
              errors.append(f"missing {binder_c}")

          flash_inc = "#include <linux/leds-qti-flash.h>"
          flash_marker = "/* redwood: cam_flash needs leds-qti-flash for QUERY_MAX_AVAIL_CURRENT */"

          def patch_cam_flash_include(rel_path: str, anchor: str) -> None:
              path = root / rel_path
              if not path.is_file():
                  errors.append(f"missing {path}")
                  return
              text = path.read_text()
              if flash_inc in text:
                  print(f"[=] {rel_path}: {flash_inc} already present")
                  return
              if anchor not in text:
                  errors.append(f"{rel_path}: include anchor not found ({anchor!r})")
                  return
              path.write_text(
                  text.replace(anchor, anchor + f"\n{flash_marker}\n{flash_inc}", 1)
              )
              print(f"[+] {rel_path}: added {flash_inc}")

          patch_cam_flash_include(
              "techpack/camera/drivers/cam_sensor_module/cam_flash/cam_flash_core.c",
              '#include "cam_packet_util.h"',
          )
          patch_cam_flash_include(
              "techpack/camera/drivers/cam_sensor_module/cam_flash/cam_flash_soc.c",
              '#include "cam_res_mgr_api.h"',
          )

          # MIUI zram writeback 使用 5.10+ block API（BLK_OPEN_* / 4-arg bio_alloc），Scarlet 5.4 需适配
          zram_drv = root / "drivers/block/zram/zram_drv.c"
          if zram_drv.is_file():
              text = zram_drv.read_text()
              zmarker = "/* redwood: zram writeback 5.4 block layer API */"
              bio_upgrades = (
                  ("bio->bi_bdev = zram->bdev;", "bio_set_dev(bio, zram->bdev);"),
                  ("bio.bi_bdev = zram->bdev;", "bio_set_dev(&bio, zram->bdev);"),
                  ("bio.bi_bdev = zw->zram->bdev;", "bio_set_dev(&bio, zw->zram->bdev);"),
              )
              upgraded = False
              for old, new in bio_upgrades:
                  if old in text:
                      text = text.replace(old, new)
                      upgraded = True
              if upgraded:
                  zram_drv.write_text(text)
                  print("[+] zram_drv.c: bi_bdev -> bio_set_dev (Scarlet 5.4 bio.h)")

              text = zram_drv.read_text()
              if zmarker in text and "BLK_OPEN_READ" not in text and "bi_bdev" not in text:
                  print("[=] zram_drv.c: 5.4 block API patch already correct")
              elif "BLK_OPEN_READ" not in text and "bio_alloc(GFP_NOIO, 1)" in text and "bi_bdev" not in text:
                  if zmarker not in text:
                      errors.append("zram_drv.c: partial 5.4 patch without marker")
                  else:
                      print("[=] zram_drv.c: already uses 5.4 block API")
              elif "BLK_OPEN_READ" not in text:
                  errors.append("zram_drv.c: unexpected state (no BLK_OPEN_READ, not fully patched)")
              else:
                  text = text.replace(
                      "BLK_OPEN_READ | BLK_OPEN_WRITE",
                      "FMODE_READ | FMODE_WRITE",
                  )
                  text = re.sub(
                      r"blkdev_get_by_dev\(([^,]+),\s*FMODE_READ \| FMODE_WRITE,\s*"
                      r"zram,\s*NULL\)",
                      r"blkdev_get_by_dev(\1, FMODE_READ | FMODE_WRITE, zram)",
                      text,
                      count=1,
                  )
                  text = text.replace(
                      "blkdev_put(bdev, zram)",
                      "blkdev_put(bdev, FMODE_READ | FMODE_WRITE)",
                  )
                  old_bio_alloc = "bio = bio_alloc(zram->bdev, 1, parent->bi_opf, GFP_NOIO);"
                  new_bio_alloc = (
                      f"{zmarker}\n"
                      "\tbio = bio_alloc(GFP_NOIO, 1);\n"
                      "\tbio_set_dev(bio, zram->bdev);\n"
                      "\tbio->bi_opf = parent->bi_opf;"
                  )
                  if old_bio_alloc not in text:
                      errors.append("zram_drv.c: 4-arg bio_alloc call not found")
                  else:
                      text = text.replace(old_bio_alloc, new_bio_alloc, 1)
                      text, n_wb = re.subn(
                          r"bio_init\(&bio,\s*zram->bdev,\s*&bio_vec,\s*1,\s*"
                          r"REQ_OP_WRITE \| REQ_SYNC\);",
                          "bio_init(&bio, &bio_vec, 1);\n"
                          "\tbio_set_dev(&bio, zram->bdev);\n"
                          "\tbio.bi_opf = REQ_OP_WRITE | REQ_SYNC;",
                          text,
                          count=1,
                      )
                      text, n_sync = re.subn(
                          r"bio_init\(&bio,\s*zw->zram->bdev,\s*&bv,\s*1,\s*REQ_OP_READ\);",
                          "bio_init(&bio, &bv, 1);\n"
                          "\tbio_set_dev(&bio, zw->zram->bdev);\n"
                          "\tbio.bi_opf = REQ_OP_READ;",
                          text,
                          count=1,
                      )
                      if n_wb != 1:
                          errors.append("zram_drv.c: writeback bio_init call not found")
                      elif n_sync != 1:
                          errors.append("zram_drv.c: sync read bio_init call not found")
                      else:
                          zram_drv.write_text(text)
                          print("[+] zram_drv.c: adapted writeback paths to Linux 5.4 block API")
              body = zram_drv.read_text()
              if "BLK_OPEN_READ" in body or "bi_bdev" in body:
                  errors.append("zram_drv.c: 5.4 block API patch failed (BLK_OPEN or bi_bdev remains)")
          else:
              errors.append(f"missing {zram_drv}")

          # Scarlet MMC CQHCI crypto 源码沿用 upstream keyslot_manager API，但 5.4 block 层只有 blk_keyslot_manager
          mmc_marker = "/* redwood: Scarlet 5.4 blk_keyslot_manager MMC crypto shim */"
          shim_h = root / "drivers/mmc/host/cqhci-blk-ksm-shim.h"
          shim_body = "\n".join([
              "/* SPDX-License-Identifier: GPL-2.0 */",
              "#ifndef CQHCI_BLK_KSM_SHIM_H",
              "#define CQHCI_BLK_KSM_SHIM_H",
              "",
              "#include <linux/crypto-qti-common.h>",
              "#include <linux/keyslot-manager.h>",
              '#include "cqhci.h"',
              "",
              "struct cqhci_ksm_ctx {",
              "\tstruct blk_keyslot_manager ksm;",
              "\tstruct cqhci_host *host;",
              "};",
              "",
              "static inline struct cqhci_host *cqhci_ksm_host(struct blk_keyslot_manager *ksm)",
              "{",
              "\treturn container_of(ksm, struct cqhci_ksm_ctx, ksm)->host;",
              "}",
              "",
              "static inline struct blk_keyslot_manager *",
              "cqhci_blk_ksm_create(struct device *dev, unsigned int num_slots,",
              "\t\t     const struct blk_ksm_ll_ops *ops,",
              "\t\t     unsigned int features,",
              "\t\t     unsigned int crypto_modes_supported[BLK_ENCRYPTION_MODE_MAX],",
              "\t\t     struct cqhci_host *host)",
              "{",
              "\tstruct cqhci_ksm_ctx *ctx;",
              "\tunsigned int i;",
              "\tint err;",
              "",
              "\tctx = devm_kzalloc(dev, sizeof(*ctx), GFP_KERNEL);",
              "\tif (!ctx)",
              "\t\treturn NULL;",
              "",
              "\tctx->host = host;",
              "\tctx->ksm.ksm_ll_ops = *ops;",
              "\tctx->ksm.features = features;",
              "\tctx->ksm.dev = dev;",
              "\tctx->ksm.max_dun_bytes_supported = sizeof(u64);",
              "\tfor (i = 0; i < BLK_ENCRYPTION_MODE_MAX; i++)",
              "\t\tctx->ksm.crypto_modes_supported[i] = crypto_modes_supported[i];",
              "",
              "\terr = devm_blk_ksm_init(dev, &ctx->ksm, num_slots);",
              "\tif (err)",
              "\t\treturn NULL;",
              "",
              "\treturn &ctx->ksm;",
              "}",
              "",
              "static inline void cqhci_get_ice_mmio_data(struct ice_mmio_data *data,",
              "\t\t\t\t\t   struct cqhci_host *host)",
              "{",
              "\tmemset(data, 0, sizeof(*data));",
              "\tdata->ice_base_mmio = host->icemmio;",
              "}",
              "",
              "#endif /* CQHCI_BLK_KSM_SHIM_H */",
              "",
          ])
          if shim_h.is_file() and mmc_marker in shim_h.read_text():
              print("[=] cqhci-blk-ksm-shim.h: already present")
          else:
              shim_h.write_text(f"{mmc_marker}\n{shim_body}")
              print("[+] cqhci-blk-ksm-shim.h: blk_keyslot_manager helpers for CQHCI crypto")

          def mmc_type_fixup(rel_path: str) -> None:
              path = root / rel_path
              if not path.is_file():
                  errors.append(f"missing {path}")
                  return
              text = path.read_text()
              orig = text
              text = text.replace("struct keyslot_manager", "struct blk_keyslot_manager")
              text = text.replace("struct keyslot_mgmt_ll_ops", "struct blk_ksm_ll_ops")
              if text != orig:
                  path.write_text(text)
                  print(f"[+] {rel_path}: keyslot_manager types -> blk_keyslot_manager")

          for _mmc_hdr in (
              "drivers/mmc/host/cqhci.h",
              "include/linux/mmc/host.h",
              "drivers/mmc/host/cqhci-crypto.h",
              "drivers/mmc/host/cqhci-crypto-qti.h",
          ):
              mmc_type_fixup(_mmc_hdr)

          ipa_i = root / "techpack/dataipa/drivers/platform/msm/ipa/ipa_v3/ipa_i.h"
          if ipa_i.is_file():
              text = ipa_i.read_text()
              ipa_marker = "/* redwood: ipa3_wakelock_ref_cnt struct guard inverted in Scarlet */"
              old_ipa = "#ifdef CONFIG_DISABLE_IPA_WAKELOCKS\nstruct ipa3_wakelock_ref_cnt {"
              new_ipa = f"{ipa_marker}\n#ifndef CONFIG_DISABLE_IPA_WAKELOCKS\nstruct ipa3_wakelock_ref_cnt {{"
              if ipa_marker in text:
                  print("[=] ipa_i.h: wakelock struct guard already fixed")
              elif old_ipa not in text:
                  if "#ifndef CONFIG_DISABLE_IPA_WAKELOCKS\nstruct ipa3_wakelock_ref_cnt {" in text:
                      print("[=] ipa_i.h: wakelock struct guard already uses #ifndef")
                  else:
                      errors.append("ipa_i.h: ipa3_wakelock_ref_cnt ifdef anchor not found")
              else:
                  ipa_i.write_text(text.replace(old_ipa, new_ipa, 1))
                  print("[+] ipa_i.h: fixed ipa3_wakelock_ref_cnt struct #ifdef inversion")
          else:
              errors.append(f"missing {ipa_i}")

          mmc_core_crypto = root / "drivers/mmc/core/crypto.c"
          if mmc_core_crypto.is_file():
              text = mmc_core_crypto.read_text()
              if "blk_ksm_get_slot_idx(req->crypt_keyslot)" in text:
                  print("[=] mmc/core/crypto.c: blk_ksm API already patched")
              else:
                  mmc_core_body = "\n".join([
                      "// SPDX-License-Identifier: GPL-2.0",
                      "/*",
                      " * Copyright 2020 Google LLC",
                      " */",
                      "",
                      "#include <linux/blk-crypto.h>",
                      "#include <linux/blkdev.h>",
                      "#include <linux/keyslot-manager.h>",
                      "#include <linux/mmc/host.h>",
                      "",
                      '#include "core.h"',
                      '#include "queue.h"',
                      "",
                      "void mmc_crypto_setup_queue(struct mmc_host *host, struct request_queue *q)",
                      "{",
                      "\tif (host->caps2 & MMC_CAP2_CRYPTO)",
                      "\t\tq->ksm = host->ksm;",
                      "}",
                      "EXPORT_SYMBOL_GPL(mmc_crypto_setup_queue);",
                      "",
                      "void mmc_crypto_free_host(struct mmc_host *host)",
                      "{",
                      "\tblk_ksm_destroy(host->ksm);",
                      "}",
                      "",
                      "void mmc_crypto_prepare_req(struct mmc_queue_req *mqrq)",
                      "{",
                      "\tstruct request *req = mmc_queue_req_to_req(mqrq);",
                      "\tstruct mmc_request *mrq = &mqrq->brq.mrq;",
                      "\tconst struct bio_crypt_ctx *bc;",
                      "",
                      "\tif (!bio_has_crypt_ctx(req->bio))",
                      "\t\treturn;",
                      "",
                      "\tbc = req->bio->bi_crypt_context;",
                      "\tif (!req->crypt_keyslot)",
                      "\t\treturn;",
                      "",
                      "\tmrq->crypto_key_slot = blk_ksm_get_slot_idx(req->crypt_keyslot);",
                      "\tmrq->data_unit_num = bc->bc_dun[0];",
                      "\tmrq->crypto_key = bc->bc_key;",
                      "}",
                      "EXPORT_SYMBOL_GPL(mmc_crypto_prepare_req);",
                      "",
                  ])
                  mmc_core_crypto.write_text(mmc_core_body)
                  print("[+] mmc/core/crypto.c: adapted to Scarlet 5.4 blk-crypto + blk_ksm")
          else:
              errors.append(f"missing {mmc_core_crypto}")

          def patch_cqhci_crypto_c(rel_path: str) -> None:
              path = root / rel_path
              if not path.is_file():
                  errors.append(f"missing {path}")
                  return
              text = path.read_text()
              if mmc_marker in text and "cqhci_blk_ksm_create" in text:
                  print(f"[=] {rel_path}: blk_ksm API already patched")
                  return
              include_anchor = '#include "../core/queue.h"'
              if include_anchor not in text:
                  errors.append(f"{rel_path}: queue.h include anchor not found")
                  return
              text = text.replace(
                  include_anchor,
                  include_anchor + f'\n{mmc_marker}\n#include "cqhci-blk-ksm-shim.h"',
                  1,
              )
              repl = (
                  ("struct keyslot_mgmt_ll_ops", "struct blk_ksm_ll_ops"),
                  ("struct keyslot_manager", "struct blk_keyslot_manager"),
                  ("keyslot_manager_private(ksm)", "cqhci_ksm_host(ksm)"),
                  ("key->crypto_mode", "key->crypto_cfg.crypto_mode"),
                  ("key->data_unit_size", "key->crypto_cfg.data_unit_size"),
                  ("keyslot_manager_create(", "cqhci_blk_ksm_create("),
                  ("keyslot_manager_destroy(", "blk_ksm_destroy("),
                  ("keyslot_manager_reprogram_all_keys(", "blk_ksm_reprogram_all_keys("),
                  ("bio_crypt_should_process(req)", "bio_has_crypt_ctx(req->bio)"),
                  ("bc->bc_keyslot", "blk_ksm_get_slot_idx(req->crypt_keyslot)"),
              )
              for old, new in repl:
                  text = text.replace(old, new)
              path.write_text(text)
              print(f"[+] {rel_path}: upstream keyslot_manager calls -> blk_ksm (5.4)")

          patch_cqhci_crypto_c("drivers/mmc/host/cqhci-crypto.c")

          qti_c = root / "drivers/mmc/host/cqhci-crypto-qti.c"
          if qti_c.is_file():
              text = qti_c.read_text()
              if mmc_marker in text and "cqhci_get_ice_mmio_data" in text:
                  print("[=] cqhci-crypto-qti.c: blk_ksm + crypto_qti API already patched")
              else:
                  include_anchor = '#include <linux/crypto-qti-common.h>'
                  if include_anchor not in text:
                      errors.append("cqhci-crypto-qti.c: crypto-qti-common include not found")
                  else:
                      text = text.replace(
                          include_anchor,
                          include_anchor + f'\n{mmc_marker}\n#include "cqhci-blk-ksm-shim.h"',
                          1,
                      )
                      text = text.replace(
                          "crypto_qti_enable(host->crypto_vops->priv);",
                          "crypto_qti_enable(host->icemmio);",
                      )
                      text = text.replace(
                          "crypto_qti_disable(host->crypto_vops->priv);",
                          "crypto_qti_disable();",
                      )
                      repl = (
                          ("struct keyslot_mgmt_ll_ops", "struct blk_ksm_ll_ops"),
                          ("struct keyslot_manager", "struct blk_keyslot_manager"),
                          ("keyslot_manager_private(ksm)", "cqhci_ksm_host(ksm)"),
                          ("key->crypto_mode", "key->crypto_cfg.crypto_mode"),
                          ("key->data_unit_size", "key->crypto_cfg.data_unit_size"),
                          ("keyslot_manager_create(", "cqhci_blk_ksm_create("),
                          ("keyslot_manager_reprogram_all_keys(", "blk_ksm_reprogram_all_keys("),
                      )
                      for old, new in repl:
                          text = text.replace(old, new)
                      if "crypto_qti_keyslot_program(&mmio_data, key," in text:
                          pass
                      elif re.search(
                          r"crypto_qti_keyslot_program\s*\(\s*host->crypto_vops->priv\s*,",
                          text,
                      ):
                          text = re.sub(
                              r"\terr = crypto_qti_keyslot_program\(host->crypto_vops->priv, key,\n"
                              r"\s+slot, data_unit_mask, crypto_alg_id\);",
                              "\tstruct ice_mmio_data mmio_data;\n"
                              "\n"
                              "\tcqhci_get_ice_mmio_data(&mmio_data, host);\n"
                              "\terr = crypto_qti_keyslot_program(&mmio_data, key,\n"
                              "\t\t\t\t slot, data_unit_mask, crypto_alg_id);",
                              text,
                              count=1,
                          )
                      else:
                          errors.append(
                              "cqhci-crypto-qti.c: crypto_qti_keyslot_program call pattern not found"
                          )
                      if "crypto_qti_keyslot_evict(&mmio_data, slot)" in text:
                          pass
                      elif re.search(
                          r"crypto_qti_keyslot_evict\s*\(\s*host->crypto_vops->priv\s*,",
                          text,
                      ):
                          text = re.sub(
                              r"\terr = crypto_qti_keyslot_evict\(host->crypto_vops->priv, slot\);",
                              "\tstruct ice_mmio_data mmio_data;\n"
                              "\n"
                              "\tcqhci_get_ice_mmio_data(&mmio_data, host);\n"
                              "\terr = crypto_qti_keyslot_evict(&mmio_data, slot);",
                              text,
                              count=1,
                          )
                      if re.search(
                          r"crypto_qti_derive_raw_secret\s*\(\s*host->crypto_vops->priv\s*,",
                          text,
                      ):
                          text = re.sub(
                              r"\terr = crypto_qti_derive_raw_secret\(host->crypto_vops->priv, "
                              r"wrapped_key, wrapped_key_size,\n"
                              r"\s+secret, secret_size\);",
                              "\terr = crypto_qti_derive_raw_secret(wrapped_key, wrapped_key_size,\n"
                              "\t\t\t\t\t     secret, secret_size);",
                              text,
                              count=1,
                          )
                      if "crypto_qti_init_crypto(host->icemmio)" in text:
                          pass
                      elif re.search(
                          r"crypto_qti_init_crypto\s*\(\s*&host->pdev->dev\s*,",
                          text,
                      ):
                          text = re.sub(
                              r"\terr = crypto_qti_init_crypto\(&host->pdev->dev, host->icemmio,\n"
                              r"\s+hwkm_ice_mmio,\n"
                              r"\s+\(void \*\*\)&host->crypto_vops->priv\);",
                              "\terr = crypto_qti_init_crypto(host->icemmio);",
                              text,
                              count=1,
                          )
                      else:
                          errors.append("cqhci-crypto-qti.c: crypto_qti_init_crypto call pattern not found")
                      text = re.sub(
                          r"\tkeyslot_manager_set_max_dun_bytes\(host->mmc->ksm, sizeof\(u32\)\);",
                          "\thost->mmc->ksm->max_dun_bytes_supported = sizeof(u32);",
                          text,
                          count=1,
                      )
                      if re.search(r"return crypto_qti_debug\s*\(\s*host->crypto_vops->priv\s*\)", text):
                          text = re.sub(
                              r"\treturn crypto_qti_debug\(host->crypto_vops->priv\);",
                              "\tstruct ice_mmio_data mmio_data;\n"
                              "\n"
                              "\tcqhci_get_ice_mmio_data(&mmio_data, host);\n"
                              "\treturn crypto_qti_debug(&mmio_data);",
                              text,
                              count=1,
                          )
                      elif "return crypto_qti_debug(&mmio_data)" in text:
                          pass
                      if re.search(
                          r"return crypto_qti_resume\s*\(\s*host->crypto_vops->priv\s*\)",
                          text,
                      ):
                          text = re.sub(
                              r"int cqhci_crypto_qti_resume\(struct cqhci_host \*host\)\n"
                              r"\{\n"
                              r"\treturn crypto_qti_resume\(host->crypto_vops->priv\);\n"
                              r"\}",
                              "int cqhci_crypto_qti_resume(struct cqhci_host *host)\n"
                              "{\n"
                              "\treturn 0;\n"
                              "}",
                              text,
                              count=1,
                          )
                      elif re.search(
                          r"int cqhci_crypto_qti_resume\(struct cqhci_host \*host\)[\s\S]*?return 0;",
                          text,
                      ):
                          pass
                      else:
                          errors.append("cqhci-crypto-qti.c: crypto_qti_resume stub pattern not found")
                      qti_c.write_text(text)
                      print("[+] cqhci-crypto-qti.c: blk_ksm + Scarlet crypto-qti-common API")
          else:
              errors.append(f"missing {qti_c}")

          msm_perf = root / "drivers/soc/qcom/msm_performance.c"
          core_ctl_marker = "redwood-core-ctl-include-guard"
          if msm_perf.is_file():
              text = msm_perf.read_text()
              if core_ctl_marker in text:
                  print("[=] msm_performance.c: core_ctl include guard already patched")
              else:
                  core_ctl_inc = "#include <linux/sched/core_ctl.h>"
                  if core_ctl_inc not in text:
                      errors.append("msm_performance.c: core_ctl include not found")
                  else:
                      text = text.replace(
                          core_ctl_inc,
                          "#ifdef CONFIG_MSM_PERFORMANCE_QGKI\n"
                          f"{core_ctl_inc}\n"
                          f"#endif /* {core_ctl_marker} */",
                          1,
                      )
                      msm_perf.write_text(text)
                      print(
                          "[+] msm_performance.c: guard core_ctl.h include "
                          "(Scarlet 5.4 missing linux/sched/core_ctl.h)"
                      )
          else:
              errors.append(f"missing {msm_perf}")

          if errors:
              print("!! redwood compile fixes FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)

          print("[OK] redwood 5.4 compile fixes applied")
          PY

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Verify redwood kernel .config
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          CFG=""
          for c in out/.config .config out/arch/${{ env.KERNEL_ARCH }}/configs/.config; do
            if [[ -f "$c" ]]; then CFG="$c"; break; fi
          done
          if [[ -z "$CFG" ]]; then
            echo "[ERROR] .config missing after build (searched out/.config .config)"
            find . -maxdepth 3 -name '.config' 2>/dev/null || true
            exit 1
          fi
          echo "[i] using config: $CFG"
          fail() { echo "[CONFIG FAIL] $1"; exit 1; }
          must() { grep -q "^${1}$" "$CFG" || fail "missing ${1}"; }
          LINES=$(wc -l < "$CFG")
          [[ "$LINES" -gt 5000 ]] || fail ".config too short (${LINES} lines) — stock merge failed?"
          must "CONFIG_LTO_CLANG=y"
          must "CONFIG_THINLTO=y"
          must "CONFIG_CFI_CLANG=y"
          must "CONFIG_SHADOW_CALL_STACK=y"
          must "CONFIG_MODULES=y"
          must "CONFIG_MODVERSIONS=y"
          must "CONFIG_MEMCG=y"
          must "CONFIG_FS_ENCRYPTION=y"
          must "CONFIG_BLK_INLINE_ENCRYPTION=y"
          must "CONFIG_QTI_HW_KEY_MANAGER=y"
          must "CONFIG_SCSI_UFS_CRYPTO=y"
          must "CONFIG_SCSI_UFS_CRYPTO_QTI=y"
          must "CONFIG_ARCH_YUPIK=y"
          must "CONFIG_PINCTRL_REDWOOD=y"
          must "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y"
          grep -q "^# CONFIG_BUILD_ARM64_DT_OVERLAY is not set" "$CFG" || fail "BUILD_ARM64_DT_OVERLAY must be disabled (stock dtbo path)"
          grep -q "^CONFIG_MACH_XIAOMI=y" "$CFG" && fail "MACH_XIAOMI must not be set (stock uses ARCH_YUPIK/PINCTRL_REDWOOD; 101618 bootloop)"
          grep -q "^CONFIG_MACH_XIAOMI_REDWOOD=y" "$CFG" && fail "MACH_XIAOMI_REDWOOD must not be set"
          grep -q "^CONFIG_ARCH_LAHAINA=y" "$CFG" && fail "ARCH_LAHAINA must be disabled (fixup: avoid lahaina DTB build)"
          grep -q "^CONFIG_ARCH_SHIMA=y" "$CFG" && fail "ARCH_SHIMA must be disabled (fixup: shima-gpu.dtsi DTC error)"
          grep -q "^CONFIG_TASK_DELAY_ACCT=y" "$CFG" && fail "TASK_DELAY_ACCT must be disabled (fixup: trace_sched_stat compile)"
          grep -q "^CONFIG_FTRACE=y" "$CFG" && fail "FTRACE must be disabled (fixup: trace_sched_stat compile)"
          grep -q "^CONFIG_SCHEDSTATS=y" "$CFG" && fail "SCHEDSTATS must be disabled (fixup: FTRACE off → trace_sched_stat_* undeclared in stats.h:60)"
          grep -q "^CONFIG_MSM_PERFORMANCE_QGKI=y" "$CFG" && fail "MSM_PERFORMANCE_QGKI must be disabled (fixup: Scarlet 5.4 has no core_ctl)"
          grep -q "^CONFIG_QTI_BATTERY_CHARGER=y" "$CFG" && fail "QTI_BATTERY_CHARGER must be disabled (stock # CONFIG_QTI_BATTERY_CHARGER is not set)"
          grep -q "^CONFIG_LTO_NONE=y" "$CFG" && fail "LTO_NONE must not be set (disables CFI → bootloop)"
          grep -q "^# CONFIG_CFI_CLANG is not set" "$CFG" && fail "CFI_CLANG disabled (LTO/CFI mismatch → bootloop)"
          grep -q "^# CONFIG_MMC is not set" "$CFG" && fail "MMC must stay enabled (stock has CONFIG_MMC=y)"
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            must "CONFIG_KSU=y"
            grep -q "^CONFIG_KSU_MANUAL_HOOK=y" "$CFG" && fail "boot-test must not force CONFIG_KSU_MANUAL_HOOK (Scarlet native hooks)"
            echo "[OK] boot-test .config: stock-aligned + CONFIG_KSU=y (ksuver 32486)"
          else
            must "CONFIG_KSU=y"
            must "CONFIG_KSU_SUSFS=y"
            echo "[OK] phase-2 .config: stock-aligned + ReSukiSU + SUSFS"
          fi
          cp -fp "$CFG" "$GITHUB_WORKSPACE/device_kernel/out/redwood-built.config"
          echo "[OK] redwood .config verified (${LINES} lines, stock-aligned v6)"

      - name: Pack AnyKernel3 (redwood, sideload only)
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          TIME=$(date +"%Y%m%d%H%M%S")
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"

          if [[ ! -d Anykernel3 ]]; then
            git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3 --depth=1
          fi

          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            KSU_LABEL="Scarlet KSU boot-test redwood crDroid16 ${TIME}"
          else
            KSU_LABEL="ReSukiSU+SUSFS redwood crDroid16 ${TIME}"
          fi

          # 禁止沿用上游 tuna/Galaxy Nexus 模板（init.tuna.rc/fstab 补丁会破坏 redwood boot ramdisk）
          cat > Anykernel3/anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## redwood crDroid16 NonGKI (minimal: dump_boot + write_boot only)

          properties() { '
          kernel.string=${KSU_LABEL}
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=redwood
          device.name2=22101320C
          device.name3=
          device.name4=
          device.name5=
          '; }

          boot_attributes() {
            set_perm_recursive 0 0 755 644 \$RAMDISK/*;
            set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }

          BLOCK=auto;
          is_slot_device=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' Anykernel3/anykernel.sh
          grep -q 'do.systemless=0' Anykernel3/anykernel.sh || { echo "[ERROR] anykernel.sh missing do.systemless=0"; exit 1; }
          grep -q 'init.tuna.rc' Anykernel3/anykernel.sh && { echo "[ERROR] anykernel.sh still contains tuna template"; exit 1; }
          grep -q 'write_boot;' Anykernel3/anykernel.sh || { echo "[ERROR] anykernel.sh missing write_boot"; exit 1; }

          mkdir -p tmp
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            # boot-test：只刷未压缩 Image，禁止 Image.gz-dtb（自带 DTB 与 stock dtbo 冲突 → bootloop）
            if [[ ! -f "$IMAGE_DIR/Image" ]]; then
              echo "[ERROR] boot-test requires out/.../boot/Image (uncompressed)"
              ls -la "$IMAGE_DIR" || true
              exit 1
            fi
            cp -fp "$IMAGE_DIR/Image" tmp/
            echo "[+] boot-test pack: Image only (no Image.gz-dtb, no dtbo)"
          else
            if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
              cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp/
              echo "[+] pack Image.gz-dtb"
            elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
              cp -fp "$IMAGE_DIR/Image.gz" tmp/
              echo "[+] pack Image.gz"
            elif [[ -f "$IMAGE_DIR/Image" ]]; then
              cp -fp "$IMAGE_DIR/Image" tmp/
              echo "[+] pack Image"
            else
              echo "[ERROR] no kernel image in $IMAGE_DIR"
              ls -la "$IMAGE_DIR" || true
              exit 1
            fi
            if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
              cp -fp "$IMAGE_DIR/dtbo.img" tmp/
            fi
            if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
              cp -fp "$IMAGE_DIR/dtb.img" tmp/dtb
            elif [[ -f "$IMAGE_DIR/dtb" ]]; then
              cp -fp "$IMAGE_DIR/dtb" tmp/
            fi
          fi

          KERNEL_FILE=$(find tmp -maxdepth 1 -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' \) | head -1)
          KERNEL_SIZE=$(stat -c%s "$KERNEL_FILE")
          KERNEL_BASE=$(basename "$KERNEL_FILE")
          case "$KERNEL_BASE" in
            Image) MIN_SIZE=30000000 ;;
            Image.gz|Image.gz-dtb) MIN_SIZE=12000000 ;;
            *) MIN_SIZE=10000000 ;;
          esac
          if [[ "$KERNEL_SIZE" -lt "$MIN_SIZE" ]]; then
            echo "[ERROR] kernel $KERNEL_BASE too small (${KERNEL_SIZE} bytes, min ${MIN_SIZE})"
            exit 1
          fi
          echo "[+] kernel size OK: $KERNEL_BASE = ${KERNEL_SIZE} bytes"

          cp -rp ./Anykernel3/* tmp/
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          AK3_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Anykernel3.zip"
          cp -fp tmp/tmp.zip "$GITHUB_WORKSPACE/device_kernel/$AK3_ZIP"
          rm -rf tmp

          echo "PACK_METHOD=Anykernel3" >> "$GITHUB_ENV"
          echo "PACK_NAME=$AK3_ZIP" >> "$GITHUB_ENV"
          echo "[OK] sideload artifact: $AK3_ZIP (UTC build id ${TIME})"
          echo "[!!] DO NOT fastboot flash raw Image or *-image.img on redwood"

      - name: Verify AnyKernel3 artifact integrity
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          ZIP="${{ env.PACK_NAME }}"
          if [[ ! -f "$ZIP" ]]; then
            ZIP=$(ls -1t redwood-*-Anykernel3.zip 2>/dev/null | head -1)
          fi
          [[ -f "$ZIP" ]] || { echo "[ERROR] missing AnyKernel3 zip"; exit 1; }
          ZSZ=$(stat -c%s "$ZIP")
          [[ "$ZSZ" -gt 10000000 ]] || { echo "[ERROR] zip too small: ${ZSZ} bytes"; exit 1; }
          LIST=$(7za l "$ZIP")
          echo "$LIST" | grep -qE 'Image(\.gz)?(-dtb)?$' || { echo "[ERROR] zip has no kernel Image"; exit 1; }
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            if echo "$LIST" | grep -qi 'dtbo'; then
              echo "[ERROR] boot-test zip must NOT contain dtbo (use stock dtbo)"
              exit 1
            fi
            echo "[OK] boot-test zip: kernel only, no dtbo"
          fi
          rm -rf /tmp/ak3verify && mkdir -p /tmp/ak3verify
          7za e -y -o/tmp/ak3verify "$ZIP" anykernel.sh >/dev/null
          grep -q 'do.systemless=0' /tmp/ak3verify/anykernel.sh || { echo "[ERROR] zip anykernel.sh must have do.systemless=0"; exit 1; }
          grep -q 'do.modules=0' /tmp/ak3verify/anykernel.sh || { echo "[ERROR] zip anykernel.sh must have do.modules=0"; exit 1; }
          grep -q 'init.tuna.rc' /tmp/ak3verify/anykernel.sh && { echo "[ERROR] zip anykernel.sh contains tuna template patches"; exit 1; }
          grep -q 'write_boot;' /tmp/ak3verify/anykernel.sh || { echo "[ERROR] zip anykernel.sh missing write_boot"; exit 1; }
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            echo "$LIST" | grep -qE 'Image\.gz-dtb' && { echo "[ERROR] boot-test zip must not contain Image.gz-dtb"; exit 1; }
          fi
          echo "[OK] anykernel.sh: minimal redwood script, do.systemless=0"
          echo "[OK] artifact integrity OK: $ZIP (${ZSZ} bytes)"

      - name: Upload kernel .config (debug)
        uses: actions/upload-artifact@v4
        with:
          name: redwood-kernel-config
          path: device_kernel/out/redwood-built.config
          if-no-files-found: error

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
