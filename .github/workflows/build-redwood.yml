name: Build Redmi Note 12 Pro Speed (redwood / SukiSU + SUSFS)

# 用法见 ../../docs/Root隐身-redwood-SUSFS云编译保姆级.md
# fork 路径: .github/workflows/build-redwood.yml
#
# v6.0.1 修复：stock merge 未覆盖 defconfig 的 MACH_XIAOMI=y → dts Makefile overlay 编译错误
# v6.0 方案 C — stock 对齐（2026-06-22）:
#   - 废弃 redwood_bootfix.config（v5 人为关 MACH_XIAOMI/改充电/改 thermal → 与 stock 偏离 → bootloop）
#   - merge 唯一基准：fork 仓库 configs/redwood_stock.config（设备 /proc/config.gz 6637 行）
#   - boot-test 仅叠加 vendor/redwood_ksu.config（CONFIG_KSU=y）+ Restore Scarlet 原生 KSU(32486)
#   - 保留 v5.8：极简 anykernel、boot-test 只 pack Image、.config/zip 校验、上传 .config 调试产物
#   - 阶段2：SUSFS_BOOT_TEST=false + SUSFS_ENABLE=true → ReSukiSU + SUSFS（仍基于 stock merge）
# fork 需两个文件：.github/workflows/build-redwood.yml + configs/redwood_stock.config
# 部署清单：configs/DEPLOY-v6.md

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "redmi_note_12_pro_speed"
  DEVICE_CODENAME : "redwood"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/Atom-X-Devs/scarlet_xiaomi_sm7325.git"
  KERNEL_BRANCH : "redwood"

  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # 两阶段编译开关（见文档 §9）:
  #   阶段1 boot-test: SUSFS_BOOT_TEST=true  + SUSFS_ENABLE=false  → Scarlet 原生 KSU(ksuver 32486)，验证能开机
  #   阶段2 满血版:    SUSFS_BOOT_TEST=false + SUSFS_ENABLE=true   → ReSukiSU + SUSFS
  SUSFS_BOOT_TEST: "true"
  SUSFS_ENABLE : false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_FIXED : false
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  BOOT_SOURCE : ""

  CRDROID_ZIP_URL : "https://master.dl.sourceforge.net/project/crdroid/redwood/12.x/crDroidAndroid-16.0-20260610-redwood-v12.11.zip"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "crdroid_a16_ksu"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  # 阶段1 boot-test：build-ready 后恢复 Scarlet 原生 KSU（能开机）；勿整树替换成 ReSukiSU main（5.4 bootloop）
  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "true"

  BUILD_OTHER_CONFIG: "true"
  # 运行时由 "Configure merge config paths" 写入；默认仅 stock
  MERGE_CONFIG_FILES: "vendor/redwood_stock.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Redmi Note 12 Pro Speed (redwood)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      # build-ready 用 KERNELSU_AUTO_GET=true + AUTO_FORK=resukisu 拉取 ReSukiSU（已验证可编译）。
      #   注意：KERNELSU_AUTO_GET=false 会走 KERNELSU_MANUAL → curl "$KERNELSU_SOURCE"(空) → URL malformed。
      # boot-test 阶段随后由 "Restore Scarlet native KernelSU" 把 drivers/kernelsu 还原为 Scarlet 原生(ksuver 32486)。
      - name: Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: Restore Scarlet native KernelSU (boot-test only)
        if: env.SUSFS_BOOT_TEST == 'true'
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          rm -rf KernelSU KernelSU-Next
          rm -f arch/${{ env.KERNEL_ARCH }}/configs/vendor/kernelsu.config
          rm -f arch/${{ env.KERNEL_ARCH }}/configs/vendor/*kernelsu*.config
          # ReSukiSU setup.sh 会把 drivers/kernelsu 换成 symlink/整目录替换；
          # 必须先 rm 再 checkout，否则 git checkout -- 无法还原 Scarlet 原生树。
          rm -rf drivers/kernelsu
          git checkout HEAD -- drivers/kernelsu
          HOOK_FILES=(
            fs/exec.c fs/read_write.c fs/open.c fs/stat.c fs/devpts/inode.c
            fs/namei.c drivers/input/input.c drivers/tty/pty.c
            security/selinux/hooks.c security/selinux/selinuxfs.c
            kernel/reboot.c kernel/sys.c
          )
          for f in "${HOOK_FILES[@]}"; do
            git checkout HEAD -- "$f" 2>/dev/null || true
          done
          DEFCFG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i '/^CONFIG_KSU_MANUAL_HOOK=/d' "$DEFCFG" || true
          if [ ! -f drivers/kernelsu/ksu.c ]; then
            echo "[ERROR] Scarlet drivers/kernelsu not restored"
            exit 1
          fi
          if [ -L drivers/kernelsu ]; then
            echo "[ERROR] drivers/kernelsu is still a symlink (ReSukiSU not removed)"
            exit 1
          fi
          # 正向校验 Scarlet 原生 hook 符号（勿用 grep ReSukiSU 字符串：ReSukiSU 树残留或误匹配）
          if ! grep -q 'ksu_hide_setprocattr' security/selinux/hooks.c; then
            echo "[ERROR] hooks.c missing Scarlet native ksu_hide_setprocattr"
            exit 1
          fi
          if grep -q 'ksu_handle_selinux_setprocattr' security/selinux/hooks.c; then
            echo "[ERROR] hooks.c still has ReSukiSU ksu_handle_selinux_setprocattr"
            exit 1
          fi
          if ! grep -q 'ksu_sel_write_context' security/selinux/selinuxfs.c; then
            echo "[ERROR] selinuxfs.c missing Scarlet native ksu_sel_write_context"
            exit 1
          fi
          echo "[OK] boot-test uses Scarlet native KSU (expect dmesg ksuver 32486)"

      - name: Install redwood stock config (v6)
        run: |
          set -euxo pipefail
          SRC=""
          for candidate in \
            "$GITHUB_WORKSPACE/configs/redwood_stock.config" \
            "$GITHUB_WORKSPACE/patches/redwood/redwood_stock.config"; do
            if [[ -f "$candidate" ]]; then
              SRC="$candidate"
              echo "[i] found stock config: $candidate"
              break
            fi
          done
          if [[ -z "$SRC" ]]; then
            echo "[ERROR] missing redwood_stock.config in fork repo"
            echo "  Upload ONE of these paths (pick either):"
            echo "    configs/redwood_stock.config"
            echo "    patches/redwood/redwood_stock.config   ← fork 已有 patches/redwood/，推荐"
            echo "  Local file:"
            echo "    autonomous-agent/android/kernel-build/configs/redwood_stock.config"
            echo "  GitHub: Add file → Upload → commit to mainline branch"
            exit 1
          fi
          DST="$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/vendor/redwood_stock.config"
          cp -fp "$SRC" "$DST"
          LINES=$(wc -l < "$DST")
          [[ "$LINES" -gt 5000 ]] || { echo "[ERROR] stock config too short (${LINES} lines)"; exit 1; }
          grep -q "^CONFIG_ARCH_YUPIK=y" "$DST" || { echo "[ERROR] stock config missing ARCH_YUPIK"; exit 1; }
          grep -q "^CONFIG_PINCTRL_REDWOOD=y" "$DST" || { echo "[ERROR] stock config missing PINCTRL_REDWOOD"; exit 1; }
          grep -q "^CONFIG_LTO_CLANG=y" "$DST" || { echo "[ERROR] stock config missing LTO_CLANG"; exit 1; }
          echo "[OK] installed redwood_stock.config (${LINES} lines from device /proc/config.gz)"

      - name: Write redwood stock fixup overlay (v6)
        run: |
          set -euxo pipefail
          FRAG="$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/vendor/redwood_stock_fixup.config"
          cat > "$FRAG" <<'EOF'
          # stock /proc/config.gz 无 MACH_* 行，但 xiaomi-qgki_defconfig 默认 MACH_XIAOMI=y；
          # 不显式关闭会触发 dts Makefile: Xiaomi DT w/o overlay is undefined!!!
          # CONFIG_MACH_XIAOMI is not set
          # CONFIG_MACH_XIAOMI_REDWOOD is not set
          # CONFIG_BUILD_ARM64_DT_OVERLAY is not set
          EOF
          sed -i 's/^          //' "$FRAG"
          echo "[OK] wrote redwood_stock_fixup.config (disable MACH_XIAOMI + DT overlay)"

      - name: Write redwood KSU overlay (boot-test)
        if: env.SUSFS_BOOT_TEST == 'true'
        run: |
          set -euxo pipefail
          FRAG="$GITHUB_WORKSPACE/device_kernel/arch/${{ env.KERNEL_ARCH }}/configs/vendor/redwood_ksu.config"
          cat > "$FRAG" <<'EOF'
          # v6 boot-test: 在 stock 基准上仅启用 Scarlet 原生 KernelSU
          CONFIG_KSU=y
          EOF
          sed -i 's/^          //' "$FRAG"
          echo "[OK] wrote redwood_ksu.config (CONFIG_KSU=y only)"

      - name: Configure merge config paths (v6)
        run: |
          set -euxo pipefail
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            echo "MERGE_CONFIG_FILES=vendor/redwood_stock.config,vendor/redwood_stock_fixup.config,vendor/redwood_ksu.config" >> "$GITHUB_ENV"
            echo "[OK] merge: stock + fixup + ksu overlay (boot-test)"
          else
            echo "MERGE_CONFIG_FILES=vendor/redwood_stock.config,vendor/redwood_stock_fixup.config" >> "$GITHUB_ENV"
            echo "[OK] merge: stock + fixup (phase-2 ReSukiSU adds kernelsu.config via build-ready)"
          fi

      - name: Validate merge config paths
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          IFS=',' read -ra FILES <<< "${{ env.MERGE_CONFIG_FILES }}"
          for f in "${FILES[@]}"; do
            p="arch/${{ env.KERNEL_ARCH }}/configs/$f"
            if [[ ! -f "$p" ]]; then
              echo "[ERROR] merge config missing: $p (MERGE_CONFIG_FILES must be comma-separated)"
              exit 1
            fi
            echo "[OK] merge config: $p"
          done

      - name: Patch Kernel of SUSFS
        if: env.SUSFS_ENABLE == 'true'
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        if: env.SUSFS_BOOT_TEST != 'true'
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          echo "[OK] v6 stock-aligned: merge vendor/redwood_stock.config (+ redwood_ksu.config boot-test)"

      - name: Patch Kernel of Re:Kernel
        if: env.SUSFS_BOOT_TEST != 'true'
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        if: env.SUSFS_BOOT_TEST != 'true'
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        if: env.SUSFS_BOOT_TEST != 'true'
        uses: ./.github/workflows/patch-baseband-guard

      - name: Set Swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 16
          remove-existing-swap-files: true

      - name: Apply redwood 5.4 compile fixes
        env:
          SUSFS_BOOT_TEST: ${{ env.SUSFS_BOOT_TEST }}
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          python3 <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          skip_susfs = os.environ.get("SUSFS_BOOT_TEST", "").lower() == "true"
          root = Path(".")
          errors = []

          if not skip_susfs:
              task_mmu = root / "fs/proc/task_mmu.c"
              if not task_mmu.is_file():
                  errors.append(f"missing {task_mmu}")
              else:
                  text = task_mmu.read_text()
                  needle = "#include <linux/pkeys.h>"
                  block = (
                      "#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) "
                      "|| defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                      "#include <linux/susfs_def.h>\n"
                      "#endif"
                  )
                  if "susfs_def.h" not in text:
                      if needle not in text:
                          errors.append("task_mmu.c: cannot find pkeys.h anchor")
                      else:
                          text = text.replace(needle, needle + "\n\n" + block, 1)
                          task_mmu.write_text(text)
                          print("[+] task_mmu.c: added susfs_def.h include")
                  else:
                      print("[=] task_mmu.c: susfs_def.h already present")

          ITERATE_GUARD = (
              "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 1, 0) && "
              "(LINUX_VERSION_CODE > KERNEL_VERSION(3, 11, 0) || defined(KSU_HAS_ITERATE_DIR))\n"
          )

          def patch_iterate_guards(content: str) -> tuple[str, int]:
              lines = content.splitlines(keepends=True)
              out = []
              patched = 0
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if not line.lstrip().startswith(
                      "#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)"
                  ):
                      out.append(line)
                      i += 1
                      continue
                  j = i + 1
                  block = line
                  cur = line
                  while cur.rstrip().endswith("\\") and j < len(lines):
                      block += lines[j]
                      cur = lines[j]
                      j += 1
                  lookahead = "".join(lines[i : min(i + 12, len(lines))])
                  if (
                      "ksu_wrapper_iterate(" in lookahead
                      or re.search(r"p->ops\.iterate\s*=", lookahead)
                      or "KSU_HAS_ITERATE_DIR" in block
                  ):
                      out.append(ITERATE_GUARD)
                      patched += 1
                      i = j
                      continue
                  out.append(line)
                  i += 1
              return "".join(out), patched

          def verify_iterate_guards(content: str) -> list[str]:
              issues = []
              # Scarlet native uses iterate_shared (>= 4.7.0 guards) — do not match *_shared substrings
              for needle in ("static int ksu_wrapper_iterate(", "p->ops.iterate ="):
                  pos = content.find(needle)
                  if pos < 0:
                      continue
                  guard_start = content.rfind("#if", 0, pos)
                  if guard_start < 0:
                      issues.append(f"missing #if before {needle}")
                      continue
                  guard_end = content.find("\n", guard_start)
                  guard = content[guard_start:guard_end]
                  if "KERNEL_VERSION(5, 1, 0)" not in guard:
                      issues.append(f"bad guard before {needle}: {guard.strip()}")
                  if "KERNEL_VERSION(6, 6, 0)" in guard:
                      issues.append(f"still uses 6.6 guard before {needle}: {guard.strip()}")
              if "ksu_wrapper_iterate_shared" in content:
                  print("[=] file_wrapper.c: Scarlet iterate_shared guards OK (skip legacy iterate check)")
              return issues

          fw = root / "drivers/kernelsu/infra/file_wrapper.c"
          if not fw.is_file():
              errors.append(f"missing {fw}")
          else:
              text = fw.read_text()
              updated, n = patch_iterate_guards(text)
              issues = verify_iterate_guards(updated)
              if issues:
                  errors.extend(f"file_wrapper.c: {issue}" for issue in issues)
              elif n > 0:
                  fw.write_text(updated)
                  print(f"[+] file_wrapper.c: disabled f_op->iterate on kernel >= 5.1 ({n} site(s))")
              else:
                  fw.write_text(updated)
                  print("[=] file_wrapper.c: iterate guards already correct")

          selinuxfs = root / "security/selinux/selinuxfs.c"
          if skip_susfs:
              if not selinuxfs.is_file():
                  errors.append(f"missing {selinuxfs}")
              elif "ksu_sel_write_context" not in selinuxfs.read_text():
                  errors.append("selinuxfs.c: Scarlet native ksu_sel_write_context hook missing (boot-test)")
              else:
                  print("[=] selinuxfs.c: Scarlet native ksu_sel_write_context kept (boot-test)")
          elif selinuxfs.is_file():
              text = selinuxfs.read_text()
              orig = text
              blocks = [
                  (
                      "#if defined(CONFIG_KSU) && !defined(CONFIG_KPROBES)\n"
                      "extern void ksu_sel_write_context(struct file **file, char **buf, size_t *size);\n"
                      "#endif\n"
                  ),
                  (
                      "#if defined(CONFIG_KSU) && !defined(CONFIG_KPROBES)\n"
                      "\tksu_sel_write_context(&file, &data, &size);\n"
                      "#endif\n"
                  ),
              ]
              for block in blocks:
                  if block in text:
                      text = text.replace(block, "", 1)
              if "ksu_sel_write_context" in text:
                  errors.append("selinuxfs.c: stale ksu_sel_write_context hook remains")
              elif text != orig:
                  selinuxfs.write_text(text)
                  print("[+] selinuxfs.c: removed stale ksu_sel_write_context hook")
              else:
                  print("[=] selinuxfs.c: no stale ksu_sel_write_context hook")
          else:
              errors.append(f"missing {selinuxfs}")

          hooks = root / "security/selinux/hooks.c"
          if skip_susfs:
              if not hooks.is_file():
                  errors.append(f"missing {hooks}")
              elif "ksu_hide_setprocattr" not in hooks.read_text():
                  errors.append("hooks.c: Scarlet native ksu_hide_setprocattr hook missing (boot-test)")
              else:
                  print("[=] hooks.c: Scarlet native ksu_hide_setprocattr kept (boot-test)")
          elif hooks.is_file():
              text = hooks.read_text()
              orig = text
              text = text.replace(
                  "extern int ksu_hide_setprocattr(const char *name, void *value, size_t size);",
                  "extern int ksu_handle_selinux_setprocattr(const char *name, void *value, size_t size);",
              )
              text = text.replace(
                  "ksu_hide_setprocattr(name, value, size);",
                  "ksu_handle_selinux_setprocattr(name, value, size);",
              )
              if "ksu_hide_setprocattr" in text:
                  errors.append("hooks.c: stale ksu_hide_setprocattr reference remains")
              elif text != orig:
                  hooks.write_text(text)
                  print("[+] hooks.c: renamed ksu_hide_setprocattr -> ksu_handle_selinux_setprocattr")
              else:
                  print("[=] hooks.c: setprocattr hook already up to date")
          else:
              errors.append(f"missing {hooks}")

          if not skip_susfs:
              sys_path = root / "kernel/sys.c"
              if sys_path.is_file():
                  text = sys_path.read_text()
                  if "susfs_spoof_uname" not in text:
                      anchor = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
                      decl = (
                          "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                          "extern struct static_key_false susfs_is_uname_spoof_buffer_set;\n"
                          "extern void susfs_spoof_uname(struct new_utsname *tmp);\n"
                          "#endif\n"
                      )
                      hook = (
                          "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                          "\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n"
                          "\t\tsusfs_spoof_uname(&tmp);\n"
                          "#endif\n"
                      )
                      if anchor in text:
                          text = text.replace(anchor, decl + anchor, 1)
                          text = text.replace(
                              "memcpy(&tmp, utsname(), sizeof(tmp));",
                              "memcpy(&tmp, utsname(), sizeof(tmp));\n" + hook,
                              1,
                          )
                          sys_path.write_text(text)
                          print("[+] sys.c: added SUSFS uname spoof hook")
                  else:
                      print("[=] sys.c: uname spoof already present")
          else:
              print("[=] boot-test build: skip sys.c SUSFS hooks")

          ufs_h = root / "drivers/scsi/ufs/ufs-qcom.h"
          if ufs_h.is_file():
              text = ufs_h.read_text()
              orig = text
              text = re.sub(
                  r"(static inline void ufs_qcom_ice_disable\s*\([^)]*\)\s*\{\s*)"
                  r"return 0;\s*(\})",
                  r"\1\2",
                  text,
              )
              if "static inline void ufs_qcom_ice_disable" in text and re.search(
                  r"static inline void ufs_qcom_ice_disable[^{]*\{[^}]*return 0;",
                  text,
                  re.DOTALL,
              ):
                  errors.append(
                      "ufs-qcom.h: void ufs_qcom_ice_disable stub still returns a value"
                  )
              elif text != orig:
                  ufs_h.write_text(text)
                  print("[+] ufs-qcom.h: fixed void ufs_qcom_ice_disable stub (no ICE)")
              else:
                  print("[=] ufs-qcom.h: ice_disable stub already correct")
          else:
              errors.append(f"missing {ufs_h}")

          platform_h = root / "drivers/soc/qcom/crypto-qti-platform.h"
          if platform_h.is_file():
              text = platform_h.read_text()
              orig = text
              old_else = "#else\nstatic inline int crypto_qti_program_key("
              new_else = (
                  "#elif IS_ENABLED(CONFIG_QTI_HW_KEY_MANAGER)\n"
                  "int crypto_qti_program_key(const struct ice_mmio_data *mmio_data,\n"
                  "\t\tconst struct blk_crypto_key *key,\n"
                  "\t\tunsigned int slot,\n"
                  "\t\tunsigned int data_unit_mask, int capid);\n"
                  "int crypto_qti_invalidate_key(const struct ice_mmio_data *mmio_data,\n"
                  "\t\tunsigned int slot);\n"
                  "int crypto_qti_derive_raw_secret_platform(\n"
                  "\t\tconst u8 *wrapped_key,\n"
                  "\t\tunsigned int wrapped_key_size, u8 *secret,\n"
                  "\t\tunsigned int secret_size);\n"
                  "void crypto_qti_disable_platform(void);\n"
                  "#else\n"
                  "static inline int crypto_qti_program_key("
              )
              if old_else in text and "#elif IS_ENABLED(CONFIG_QTI_HW_KEY_MANAGER)" not in text:
                  text = text.replace(old_else, new_else, 1)
              if "static inline int crypto_qti_program_key(" in text:
                  pos = text.find("static inline int crypto_qti_program_key(")
                  guard = text.rfind("#if", 0, pos)
                  guard_line = text[guard:text.find("\n", guard)] if guard >= 0 else ""
                  if "#elif IS_ENABLED(CONFIG_QTI_HW_KEY_MANAGER)" not in text[
                      max(0, guard - 200) : pos
                  ]:
                      errors.append(
                          "crypto-qti-platform.h: inline stubs still active with HWKM"
                      )
              if text != orig:
                  platform_h.write_text(text)
                  print("[+] crypto-qti-platform.h: HWKM-only forward decls (no stub clash)")
              else:
                  print("[=] crypto-qti-platform.h: already correct")
          else:
              errors.append(f"missing {platform_h}")

          # v6: stock fixup 显式关 MACH_XIAOMI；仍 patch dts Makefile 以防 merge 顺序遗漏
          dt_mk = root / "arch/arm64/boot/dts/vendor/qcom/Makefile"
          if dt_mk.is_file():
              text = dt_mk.read_text()
              orig = text
              old_block = (
                  "ifeq ($(CONFIG_MACH_XIAOMI), y)\n"
                  "ifneq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y)\n"
                  "$(error Xiaomi DT w/o overlay is undefined!!!)\n"
                  "endif\n"
                  "\n"
                  "dtbo-$(CONFIG_MACH_XIAOMI_LISA) += lisa-sm7325-overlay.dtbo\n"
                  "dtbo-$(CONFIG_MACH_XIAOMI_REDWOOD) += redwood-sm7325-overlay.dtbo\n"
                  "\n"
                  "lisa-sm7325-overlay.dtbo-base := yupik.dtb\n"
                  "redwood-sm7325-overlay.dtbo-base := yupik.dtb\n"
                  "\n"
                  "else"
              )
              new_block = (
                  "ifeq ($(CONFIG_MACH_XIAOMI), y)\n"
                  "ifeq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y)\n"
                  "dtbo-$(CONFIG_MACH_XIAOMI_LISA) += lisa-sm7325-overlay.dtbo\n"
                  "dtbo-$(CONFIG_MACH_XIAOMI_REDWOOD) += redwood-sm7325-overlay.dtbo\n"
                  "\n"
                  "lisa-sm7325-overlay.dtbo-base := yupik.dtb\n"
                  "redwood-sm7325-overlay.dtbo-base := yupik.dtb\n"
                  "endif\n"
                  "\n"
                  "else"
              )
              if old_block in text:
                  text = text.replace(old_block, new_block, 1)
                  dt_mk.write_text(text)
                  print("[+] dts Makefile: allow Xiaomi build without BUILD_ARM64_DT_OVERLAY")
              elif "Xiaomi DT w/o overlay is undefined" not in text:
                  print("[=] dts Makefile: Xiaomi overlay guard already patched")
              else:
                  errors.append("dts Makefile: cannot patch Xiaomi overlay hard error")
          else:
              errors.append(f"missing {dt_mk}")

          # Scarlet 把 shrinker_list 的锁重构成 shrinker_rwlock，但 #ifdef CONFIG_MEMCG 块内
          # 操作 shrinker_idr 的代码（prealloc/unregister_memcg_shrinker、shrink_slab_memcg）
          # 仍用 shrinker_rwsem 且声明被误删 → 开 MEMCG 即报 undeclared。该路径持锁期间会睡眠
          # （do_shrink_slab），必须用可睡眠的 rwsem，故补回声明而非改成自旋的 rwlock。
          vmscan = root / "mm/vmscan.c"
          if vmscan.is_file():
              text = vmscan.read_text()
              decl = "static DECLARE_RWSEM(shrinker_rwsem);"
              anchor = "static DEFINE_RWLOCK(shrinker_rwlock);"
              if decl in text:
                  print("[=] vmscan.c: shrinker_rwsem already declared")
              elif "shrinker_rwsem" not in text:
                  print("[=] vmscan.c: no shrinker_rwsem reference (nothing to fix)")
              elif anchor in text:
                  text = text.replace(anchor, anchor + "\n" + decl, 1)
                  vmscan.write_text(text)
                  print("[+] vmscan.c: re-declared shrinker_rwsem for MEMCG idr block")
              else:
                  errors.append("vmscan.c: cannot find shrinker_rwlock anchor for shrinker_rwsem decl")
          else:
              errors.append(f"missing {vmscan}")

          if errors:
              print("!! redwood compile fixes FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)

          print("[OK] redwood 5.4 compile fixes applied")
          PY

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Verify redwood kernel .config
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          CFG=""
          for c in out/.config .config out/arch/${{ env.KERNEL_ARCH }}/configs/.config; do
            if [[ -f "$c" ]]; then CFG="$c"; break; fi
          done
          if [[ -z "$CFG" ]]; then
            echo "[ERROR] .config missing after build (searched out/.config .config)"
            find . -maxdepth 3 -name '.config' 2>/dev/null || true
            exit 1
          fi
          echo "[i] using config: $CFG"
          fail() { echo "[CONFIG FAIL] $1"; exit 1; }
          must() { grep -q "^${1}$" "$CFG" || fail "missing ${1}"; }
          LINES=$(wc -l < "$CFG")
          [[ "$LINES" -gt 5000 ]] || fail ".config too short (${LINES} lines) — stock merge failed?"
          must "CONFIG_LTO_CLANG=y"
          must "CONFIG_THINLTO=y"
          must "CONFIG_CFI_CLANG=y"
          must "CONFIG_SHADOW_CALL_STACK=y"
          must "CONFIG_MODULES=y"
          must "CONFIG_MODVERSIONS=y"
          must "CONFIG_MEMCG=y"
          must "CONFIG_FS_ENCRYPTION=y"
          must "CONFIG_BLK_INLINE_ENCRYPTION=y"
          must "CONFIG_QTI_HW_KEY_MANAGER=y"
          must "CONFIG_SCSI_UFS_CRYPTO=y"
          must "CONFIG_SCSI_UFS_CRYPTO_QTI=y"
          must "CONFIG_ARCH_YUPIK=y"
          must "CONFIG_PINCTRL_REDWOOD=y"
          must "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y"
          grep -q "^# CONFIG_BUILD_ARM64_DT_OVERLAY is not set" "$CFG" || fail "BUILD_ARM64_DT_OVERLAY must be disabled (stock dtbo path)"
          grep -q "^CONFIG_MACH_XIAOMI=y" "$CFG" && fail "MACH_XIAOMI must not be set (stock uses ARCH_YUPIK/PINCTRL_REDWOOD; 101618 bootloop)"
          grep -q "^CONFIG_MACH_XIAOMI_REDWOOD=y" "$CFG" && fail "MACH_XIAOMI_REDWOOD must not be set"
          grep -q "^CONFIG_QTI_BATTERY_CHARGER=y" "$CFG" && fail "QTI_BATTERY_CHARGER must be disabled (stock # CONFIG_QTI_BATTERY_CHARGER is not set)"
          grep -q "^CONFIG_LTO_NONE=y" "$CFG" && fail "LTO_NONE must not be set (disables CFI → bootloop)"
          grep -q "^# CONFIG_CFI_CLANG is not set" "$CFG" && fail "CFI_CLANG disabled (LTO/CFI mismatch → bootloop)"
          grep -q "^# CONFIG_MMC is not set" "$CFG" && fail "MMC must stay enabled (stock has CONFIG_MMC=y)"
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            must "CONFIG_KSU=y"
            grep -q "^CONFIG_KSU_MANUAL_HOOK=y" "$CFG" && fail "boot-test must not force CONFIG_KSU_MANUAL_HOOK (Scarlet native hooks)"
            echo "[OK] boot-test .config: stock-aligned + CONFIG_KSU=y (ksuver 32486)"
          else
            must "CONFIG_KSU=y"
            must "CONFIG_KSU_SUSFS=y"
            echo "[OK] phase-2 .config: stock-aligned + ReSukiSU + SUSFS"
          fi
          cp -fp "$CFG" "$GITHUB_WORKSPACE/device_kernel/out/redwood-built.config"
          echo "[OK] redwood .config verified (${LINES} lines, stock-aligned v6)"

      - name: Pack AnyKernel3 (redwood, sideload only)
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          TIME=$(date +"%Y%m%d%H%M%S")
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"

          if [[ ! -d Anykernel3 ]]; then
            git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3 --depth=1
          fi

          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            KSU_LABEL="Scarlet KSU boot-test redwood crDroid16 ${TIME}"
          else
            KSU_LABEL="ReSukiSU+SUSFS redwood crDroid16 ${TIME}"
          fi

          # 禁止沿用上游 tuna/Galaxy Nexus 模板（init.tuna.rc/fstab 补丁会破坏 redwood boot ramdisk）
          cat > Anykernel3/anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## redwood crDroid16 NonGKI (minimal: dump_boot + write_boot only)

          properties() { '
          kernel.string=${KSU_LABEL}
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=redwood
          device.name2=22101320C
          device.name3=
          device.name4=
          device.name5=
          '; }

          boot_attributes() {
            set_perm_recursive 0 0 755 644 \$RAMDISK/*;
            set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          }

          BLOCK=auto;
          is_slot_device=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' Anykernel3/anykernel.sh
          grep -q 'do.systemless=0' Anykernel3/anykernel.sh || { echo "[ERROR] anykernel.sh missing do.systemless=0"; exit 1; }
          grep -q 'init.tuna.rc' Anykernel3/anykernel.sh && { echo "[ERROR] anykernel.sh still contains tuna template"; exit 1; }
          grep -q 'write_boot;' Anykernel3/anykernel.sh || { echo "[ERROR] anykernel.sh missing write_boot"; exit 1; }

          mkdir -p tmp
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            # boot-test：只刷未压缩 Image，禁止 Image.gz-dtb（自带 DTB 与 stock dtbo 冲突 → bootloop）
            if [[ ! -f "$IMAGE_DIR/Image" ]]; then
              echo "[ERROR] boot-test requires out/.../boot/Image (uncompressed)"
              ls -la "$IMAGE_DIR" || true
              exit 1
            fi
            cp -fp "$IMAGE_DIR/Image" tmp/
            echo "[+] boot-test pack: Image only (no Image.gz-dtb, no dtbo)"
          else
            if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
              cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp/
              echo "[+] pack Image.gz-dtb"
            elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
              cp -fp "$IMAGE_DIR/Image.gz" tmp/
              echo "[+] pack Image.gz"
            elif [[ -f "$IMAGE_DIR/Image" ]]; then
              cp -fp "$IMAGE_DIR/Image" tmp/
              echo "[+] pack Image"
            else
              echo "[ERROR] no kernel image in $IMAGE_DIR"
              ls -la "$IMAGE_DIR" || true
              exit 1
            fi
            if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
              cp -fp "$IMAGE_DIR/dtbo.img" tmp/
            fi
            if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
              cp -fp "$IMAGE_DIR/dtb.img" tmp/dtb
            elif [[ -f "$IMAGE_DIR/dtb" ]]; then
              cp -fp "$IMAGE_DIR/dtb" tmp/
            fi
          fi

          KERNEL_FILE=$(find tmp -maxdepth 1 -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' \) | head -1)
          KERNEL_SIZE=$(stat -c%s "$KERNEL_FILE")
          KERNEL_BASE=$(basename "$KERNEL_FILE")
          case "$KERNEL_BASE" in
            Image) MIN_SIZE=30000000 ;;
            Image.gz|Image.gz-dtb) MIN_SIZE=12000000 ;;
            *) MIN_SIZE=10000000 ;;
          esac
          if [[ "$KERNEL_SIZE" -lt "$MIN_SIZE" ]]; then
            echo "[ERROR] kernel $KERNEL_BASE too small (${KERNEL_SIZE} bytes, min ${MIN_SIZE})"
            exit 1
          fi
          echo "[+] kernel size OK: $KERNEL_BASE = ${KERNEL_SIZE} bytes"

          cp -rp ./Anykernel3/* tmp/
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          AK3_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Anykernel3.zip"
          cp -fp tmp/tmp.zip "$GITHUB_WORKSPACE/device_kernel/$AK3_ZIP"
          rm -rf tmp

          echo "PACK_METHOD=Anykernel3" >> "$GITHUB_ENV"
          echo "PACK_NAME=$AK3_ZIP" >> "$GITHUB_ENV"
          echo "[OK] sideload artifact: $AK3_ZIP (UTC build id ${TIME})"
          echo "[!!] DO NOT fastboot flash raw Image or *-image.img on redwood"

      - name: Verify AnyKernel3 artifact integrity
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          ZIP="${{ env.PACK_NAME }}"
          if [[ ! -f "$ZIP" ]]; then
            ZIP=$(ls -1t redwood-*-Anykernel3.zip 2>/dev/null | head -1)
          fi
          [[ -f "$ZIP" ]] || { echo "[ERROR] missing AnyKernel3 zip"; exit 1; }
          ZSZ=$(stat -c%s "$ZIP")
          [[ "$ZSZ" -gt 10000000 ]] || { echo "[ERROR] zip too small: ${ZSZ} bytes"; exit 1; }
          LIST=$(7za l "$ZIP")
          echo "$LIST" | grep -qE 'Image(\.gz)?(-dtb)?$' || { echo "[ERROR] zip has no kernel Image"; exit 1; }
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            if echo "$LIST" | grep -qi 'dtbo'; then
              echo "[ERROR] boot-test zip must NOT contain dtbo (use stock dtbo)"
              exit 1
            fi
            echo "[OK] boot-test zip: kernel only, no dtbo"
          fi
          rm -rf /tmp/ak3verify && mkdir -p /tmp/ak3verify
          7za e -y -o/tmp/ak3verify "$ZIP" anykernel.sh >/dev/null
          grep -q 'do.systemless=0' /tmp/ak3verify/anykernel.sh || { echo "[ERROR] zip anykernel.sh must have do.systemless=0"; exit 1; }
          grep -q 'do.modules=0' /tmp/ak3verify/anykernel.sh || { echo "[ERROR] zip anykernel.sh must have do.modules=0"; exit 1; }
          grep -q 'init.tuna.rc' /tmp/ak3verify/anykernel.sh && { echo "[ERROR] zip anykernel.sh contains tuna template patches"; exit 1; }
          grep -q 'write_boot;' /tmp/ak3verify/anykernel.sh || { echo "[ERROR] zip anykernel.sh missing write_boot"; exit 1; }
          if [[ "${{ env.SUSFS_BOOT_TEST }}" == "true" ]]; then
            echo "$LIST" | grep -qE 'Image\.gz-dtb' && { echo "[ERROR] boot-test zip must not contain Image.gz-dtb"; exit 1; }
          fi
          echo "[OK] anykernel.sh: minimal redwood script, do.systemless=0"
          echo "[OK] artifact integrity OK: $ZIP (${ZSZ} bytes)"

      - name: Upload kernel .config (debug)
        uses: actions/upload-artifact@v4
        with:
          name: redwood-kernel-config
          path: device_kernel/out/redwood-built.config
          if-no-files-found: error

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
