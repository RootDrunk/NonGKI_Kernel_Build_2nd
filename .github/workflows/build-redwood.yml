name: Build Redmi Note 12 Pro Speed (redwood / SukiSU + SUSFS)

# 用法见同目录 ../../docs/Root隐身-redwood-SUSFS云编译保姆级.md
# 放置路径(在 fork 的 JackA1ltman/NonGKI_Kernel_Build_2nd 仓库内):
#   .github/workflows/build-redwood.yml
# 然后 Actions 里手动触发本工作流即可。

on:
  workflow_call:
  workflow_dispatch:

env:
  # ---------- 设备 ----------
  DEVICE_NAME : "redmi_note_12_pro_speed"
  DEVICE_CODENAME : "redwood"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  # ---------- 内核源 (Scarlet sm7325, redwood 分支) ----------
  KERNEL_SOURCE : "https://github.com/Atom-X-Devs/scarlet_xiaomi_sm7325.git"
  KERNEL_BRANCH : "redwood"

  # ---------- 工具链 (LineageOS clang r416183b, 5.4 验证可用) ----------
  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  # ---------- defconfig: base + fragment ----------
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ---------- KernelSU: SukiSU 系 (ReSukiSU, 5.4 已验证) ----------
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk, next, resukisu and sukisu

  # ---------- SUSFS: 框架自动匹配版本 ----------
  SUSFS_ENABLE : true
  SUSFS_FIXED : false   # 首跑用 false(免自建补丁仓); 若有 .rej 再改 true + 下面两项

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "crdroid_a16"

  # ---------- 其他 ----------
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: ""   # 首跑留空
  SUSFS_PATCH_FIXED: ""    # 首跑留空; 出 .rej 后填修补补丁名

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall"  # 非 GKI 手动 hook

  KERNEL_PATCH: "false"   # 5.4 > 4.9, 不需要

  KPM_ENABLE: "false"     # 5.4 非GKI 暂不开; KPM 留给 GKI 量产机
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"  # 首跑开: 抓 .rej 冲突并作为 artifact 上传
  SKIP_PATCH: "true"      # 配合上面: 即使有 .rej 也继续尝试编译, 不硬失败

  BUILD_OTHER_CONFIG: "true"  # 合并 fragment
  MERGE_CONFIG_FILES: "vendor/redwood.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Redmi Note 12 Pro Speed (redwood)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Set Swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 16
          remove-existing-swap-files: true

      # 必须在 Build Process 之前、且 KSU/SUSFS 全部打完后再跑（不依赖 fork 里单独上传 patch 文件）
      - name: Apply redwood 5.4 compile fixes
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          errors = []

          task_mmu = root / "fs/proc/task_mmu.c"
          if not task_mmu.is_file():
              errors.append(f"missing {task_mmu}")
          else:
              text = task_mmu.read_text()
              needle = "#include <linux/pkeys.h>"
              block = (
                  "#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) "
                  "|| defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif"
              )
              if "susfs_def.h" not in text:
                  if needle not in text:
                      errors.append("task_mmu.c: cannot find pkeys.h anchor")
                  else:
                      text = text.replace(needle, needle + "\n\n" + block, 1)
                      task_mmu.write_text(text)
                      print("[+] task_mmu.c: added susfs_def.h include")
              else:
                  print("[=] task_mmu.c: susfs_def.h already present")

          fw = root / "drivers/kernelsu/infra/file_wrapper.c"
          if not fw.is_file():
              errors.append(f"missing {fw}")
          else:
              text = fw.read_text()
              old_if = (
                  r"#if LINUX_VERSION_CODE < KERNEL_VERSION\(6, 6, 0\) &&\s*"
                  r"\(LINUX_VERSION_CODE > KERNEL_VERSION\(3, 11, 0\) \|\| defined\(KSU_HAS_ITERATE_DIR\)\)"
              )
              new_if = (
                  "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 1, 0) && "
                  "(LINUX_VERSION_CODE > KERNEL_VERSION(3, 11, 0) || defined(KSU_HAS_ITERATE_DIR))"
              )
              updated, n = re.subn(old_if, new_if, text)
              if n == 0 and "KERNEL_VERSION(5, 1, 0)" not in text:
                  errors.append("file_wrapper.c: iterate guard not patched (pattern mismatch)")
              elif n > 0:
                  fw.write_text(updated)
                  print(f"[+] file_wrapper.c: disabled f_op->iterate on kernel >= 5.1 ({n} site(s))")
              else:
                  print("[=] file_wrapper.c: iterate guard already patched")

          sys_path = root / "kernel/sys.c"
          if sys_path.is_file():
              text = sys_path.read_text()
              if "susfs_spoof_uname" not in text:
                  anchor = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
                  decl = (
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                      "extern struct static_key_false susfs_is_uname_spoof_buffer_set;\n"
                      "extern void susfs_spoof_uname(struct new_utsname *tmp);\n"
                      "#endif\n"
                  )
                  hook = (
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                      "\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n"
                      "\t\tsusfs_spoof_uname(&tmp);\n"
                      "#endif\n"
                  )
                  if anchor in text:
                      text = text.replace(anchor, decl + anchor, 1)
                      text = text.replace(
                          "memcpy(&tmp, utsname(), sizeof(tmp));",
                          "memcpy(&tmp, utsname(), sizeof(tmp));\n" + hook,
                          1,
                      )
                      sys_path.write_text(text)
                      print("[+] sys.c: added SUSFS uname spoof hook")
              else:
                  print("[=] sys.c: uname spoof already present")

          if errors:
              print("!! redwood compile fixes FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)

          print("[OK] redwood 5.4 compile fixes applied")
          PY

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
