name: Build Redmi Note 12 Pro Speed (redwood / SukiSU + SUSFS)

# 用法见同目录 ../../docs/Root隐身-redwood-SUSFS云编译保姆级.md
# 放置路径(在 fork 的 JackA1ltman/NonGKI_Kernel_Build_2nd 仓库内):
#   .github/workflows/build-redwood.yml
# 然后 Actions 里手动触发本工作流即可。

on:
  workflow_call:
  workflow_dispatch:

env:
  # ---------- 设备 ----------
  DEVICE_NAME : "redmi_note_12_pro_speed"
  DEVICE_CODENAME : "redwood"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  # ---------- 内核源 (Scarlet sm7325, redwood 分支) ----------
  KERNEL_SOURCE : "https://github.com/Atom-X-Devs/scarlet_xiaomi_sm7325.git"
  KERNEL_BRANCH : "redwood"

  # ---------- 工具链 (LineageOS clang r416183b, 5.4 验证可用) ----------
  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  # ---------- defconfig: base + fragment ----------
  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi-qgki_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ---------- KernelSU: SukiSU 系 (ReSukiSU, 5.4 已验证) ----------
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk, next, resukisu and sukisu

  # ---------- SUSFS: 框架自动匹配版本 ----------
  SUSFS_ENABLE : true
  SUSFS_FIXED : false   # 首跑用 false(免自建补丁仓); 若有 .rej 再改 true + 下面两项

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  # MKBOOTIMG 打包时由下方 Prepare 步骤从 crDroid OTA 解出 boot.img，此处留空即可
  BOOT_SOURCE : ""

  # crDroid 16 redwood OTA（与 device-backups/redwood 内 zip 一致）
  CRDROID_ZIP_URL : "https://master.dl.sourceforge.net/project/crdroid/redwood/12.x/crDroidAndroid-16.0-20260610-redwood-v12.11.zip"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "crdroid_a16"

  # ---------- 其他 ----------
  PYTHON_VERSION: "3"

  # build-ready 阶段仍用 Anykernel3（免 BOOT_SOURCE）；实际打包在 Pack 步骤走 MKBOOTIMG
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"
  KERNELSU_SUS_PATCH: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: ""   # 首跑留空
  SUSFS_PATCH_FIXED: ""    # 首跑留空; 出 .rej 后填修补补丁名

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall"  # 非 GKI 手动 hook

  KERNEL_PATCH: "false"   # 5.4 > 4.9, 不需要

  KPM_ENABLE: "false"     # 5.4 非GKI 暂不开; KPM 留给 GKI 量产机
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"  # 首跑开: 抓 .rej 冲突并作为 artifact 上传
  SKIP_PATCH: "true"      # 配合上面: 即使有 .rej 也继续尝试编译, 不硬失败

  BUILD_OTHER_CONFIG: "true"  # 合并 fragment
  MERGE_CONFIG_FILES: "vendor/redwood.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Redmi Note 12 Pro Speed (redwood)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Set Swap
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 16
          remove-existing-swap-files: true

      # 必须在 Build Process 之前、且 KSU/SUSFS 全部打完后再跑（不依赖 fork 里单独上传 patch 文件）
      - name: Apply redwood 5.4 compile fixes
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          python3 <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(".")
          errors = []

          task_mmu = root / "fs/proc/task_mmu.c"
          if not task_mmu.is_file():
              errors.append(f"missing {task_mmu}")
          else:
              text = task_mmu.read_text()
              needle = "#include <linux/pkeys.h>"
              block = (
                  "#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) "
                  "|| defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n"
                  "#include <linux/susfs_def.h>\n"
                  "#endif"
              )
              if "susfs_def.h" not in text:
                  if needle not in text:
                      errors.append("task_mmu.c: cannot find pkeys.h anchor")
                  else:
                      text = text.replace(needle, needle + "\n\n" + block, 1)
                      task_mmu.write_text(text)
                      print("[+] task_mmu.c: added susfs_def.h include")
              else:
                  print("[=] task_mmu.c: susfs_def.h already present")

          ITERATE_GUARD = (
              "#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 1, 0) && "
              "(LINUX_VERSION_CODE > KERNEL_VERSION(3, 11, 0) || defined(KSU_HAS_ITERATE_DIR))\n"
          )

          def patch_iterate_guards(content: str) -> tuple[str, int]:
              lines = content.splitlines(keepends=True)
              out = []
              patched = 0
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if not line.lstrip().startswith(
                      "#if LINUX_VERSION_CODE < KERNEL_VERSION(6, 6, 0)"
                  ):
                      out.append(line)
                      i += 1
                      continue
                  j = i + 1
                  block = line
                  cur = line
                  while cur.rstrip().endswith("\\") and j < len(lines):
                      block += lines[j]
                      cur = lines[j]
                      j += 1
                  lookahead = "".join(lines[i : min(i + 12, len(lines))])
                  if (
                      "ksu_wrapper_iterate" in lookahead
                      or "p->ops.iterate" in lookahead
                      or "KSU_HAS_ITERATE_DIR" in block
                  ):
                      out.append(ITERATE_GUARD)
                      patched += 1
                      i = j
                      continue
                  out.append(line)
                  i += 1
              return "".join(out), patched

          def verify_iterate_guards(content: str) -> list[str]:
              issues = []
              for needle in ("static int ksu_wrapper_iterate", "p->ops.iterate"):
                  pos = content.find(needle)
                  if pos < 0:
                      continue
                  guard_start = content.rfind("#if", 0, pos)
                  if guard_start < 0:
                      issues.append(f"missing #if before {needle}")
                      continue
                  guard_end = content.find("\n", guard_start)
                  guard = content[guard_start:guard_end]
                  if "KERNEL_VERSION(5, 1, 0)" not in guard:
                      issues.append(f"bad guard before {needle}: {guard.strip()}")
                  if "KERNEL_VERSION(6, 6, 0)" in guard:
                      issues.append(f"still uses 6.6 guard before {needle}: {guard.strip()}")
              return issues

          fw = root / "drivers/kernelsu/infra/file_wrapper.c"
          if not fw.is_file():
              errors.append(f"missing {fw}")
          else:
              text = fw.read_text()
              updated, n = patch_iterate_guards(text)
              issues = verify_iterate_guards(updated)
              if issues:
                  errors.extend(f"file_wrapper.c: {issue}" for issue in issues)
              elif n > 0:
                  fw.write_text(updated)
                  print(f"[+] file_wrapper.c: disabled f_op->iterate on kernel >= 5.1 ({n} site(s))")
              else:
                  fw.write_text(updated)
                  print("[=] file_wrapper.c: iterate guards already correct")

          selinuxfs = root / "security/selinux/selinuxfs.c"
          if selinuxfs.is_file():
              text = selinuxfs.read_text()
              orig = text
              blocks = [
                  (
                      "#if defined(CONFIG_KSU) && !defined(CONFIG_KPROBES)\n"
                      "extern void ksu_sel_write_context(struct file **file, char **buf, size_t *size);\n"
                      "#endif\n"
                  ),
                  (
                      "#if defined(CONFIG_KSU) && !defined(CONFIG_KPROBES)\n"
                      "\tksu_sel_write_context(&file, &data, &size);\n"
                      "#endif\n"
                  ),
              ]
              for block in blocks:
                  if block in text:
                      text = text.replace(block, "", 1)
              if "ksu_sel_write_context" in text:
                  errors.append("selinuxfs.c: stale ksu_sel_write_context hook remains")
              elif text != orig:
                  selinuxfs.write_text(text)
                  print("[+] selinuxfs.c: removed stale ksu_sel_write_context hook")
              else:
                  print("[=] selinuxfs.c: no stale ksu_sel_write_context hook")
          else:
              errors.append(f"missing {selinuxfs}")

          hooks = root / "security/selinux/hooks.c"
          if hooks.is_file():
              text = hooks.read_text()
              orig = text
              text = text.replace(
                  "extern int ksu_hide_setprocattr(const char *name, void *value, size_t size);",
                  "extern int ksu_handle_selinux_setprocattr(const char *name, void *value, size_t size);",
              )
              text = text.replace(
                  "ksu_hide_setprocattr(name, value, size);",
                  "ksu_handle_selinux_setprocattr(name, value, size);",
              )
              if "ksu_hide_setprocattr" in text:
                  errors.append("hooks.c: stale ksu_hide_setprocattr reference remains")
              elif text != orig:
                  hooks.write_text(text)
                  print("[+] hooks.c: renamed ksu_hide_setprocattr -> ksu_handle_selinux_setprocattr")
              else:
                  print("[=] hooks.c: setprocattr hook already up to date")
          else:
              errors.append(f"missing {hooks}")

          sys_path = root / "kernel/sys.c"
          if sys_path.is_file():
              text = sys_path.read_text()
              if "susfs_spoof_uname" not in text:
                  anchor = "SYSCALL_DEFINE1(newuname, struct new_utsname __user *, name)"
                  decl = (
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                      "extern struct static_key_false susfs_is_uname_spoof_buffer_set;\n"
                      "extern void susfs_spoof_uname(struct new_utsname *tmp);\n"
                      "#endif\n"
                  )
                  hook = (
                      "#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\n"
                      "\tif (static_branch_likely(&susfs_is_uname_spoof_buffer_set))\n"
                      "\t\tsusfs_spoof_uname(&tmp);\n"
                      "#endif\n"
                  )
                  if anchor in text:
                      text = text.replace(anchor, decl + anchor, 1)
                      text = text.replace(
                          "memcpy(&tmp, utsname(), sizeof(tmp));",
                          "memcpy(&tmp, utsname(), sizeof(tmp));\n" + hook,
                          1,
                      )
                      sys_path.write_text(text)
                      print("[+] sys.c: added SUSFS uname spoof hook")
              else:
                  print("[=] sys.c: uname spoof already present")

          if errors:
              print("!! redwood compile fixes FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)

          print("[OK] redwood 5.4 compile fixes applied")
          PY

      - name: Build Process
        uses: ./.github/workflows/build-process

      # 用 crDroid 同版本 boot.img 做基底重打包，避免纯 Image sideload 与 ramdisk/header 不匹配导致 bootloop
      - name: Pack redwood boot (MKBOOTIMG + AnyKernel3)
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          TIME=$(date +"%Y%m%d%H%M%S")
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"
          BOOT_BASE="$GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img"

          echo "[+] Fetch crDroid OTA and extract boot.img ..."
          ${{ env.CURLX }} "${{ env.CRDROID_ZIP_URL }}" crdroid.zip
          unzip -j -o crdroid.zip payload.bin
          ${{ env.CURLX }} "https://github.com/ssut/payload-dumper-go/releases/download/1.3.0/payload-dumper-go_1.3.0_linux_amd64.tar.gz" pdu.tar.gz
          tar -xzf pdu.tar.gz payload-dumper-go
          chmod +x payload-dumper-go
          ./payload-dumper-go -p boot -o boot_extract payload.bin
          test -s boot_extract/boot.img
          cp -fp boot_extract/boot.img "$BOOT_BASE"
          ls -lh "$BOOT_BASE"

          echo "[+] MKBOOTIMG repack with crDroid boot header ..."
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkboottools -b main-kernel-build-2024 --depth=1
          FORMAT_MKBOOTING=$(mkboottools/unpack_bootimg.py --boot_img="$BOOT_BASE" --format mkbootimg)
          mkboottools/unpack_bootimg.py --boot_img "$BOOT_BASE"

          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            rm -f out/kernel
            cp -fp "$IMAGE_DIR/Image.gz-dtb" out/kernel
            echo "[+] Using Image.gz-dtb"
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            rm -f out/kernel
            cp -fp "$IMAGE_DIR/Image.gz" out/kernel
            echo "[+] Using Image.gz"
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            rm -f out/kernel
            cp -fp "$IMAGE_DIR/Image" out/kernel
            echo "[+] Using Image"
          else
            echo "[-] No kernel image under $IMAGE_DIR"
            ls -la "$IMAGE_DIR" || true
            exit 1
          fi

          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp "$IMAGE_DIR/dtb.img" out/dtb
            echo "[+] Using dtb.img"
          elif [[ -f "$IMAGE_DIR/dtb" ]]; then
            cp -fp "$IMAGE_DIR/dtb" out/dtb
            echo "[+] Using dtb"
          fi

          OUT_IMG="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-image.img"
          eval "mkboottools/mkbootimg.py $FORMAT_MKBOOTING -o $OUT_IMG"
          ls -lh "$OUT_IMG"

          echo "[+] Patch AnyKernel3 for redwood (recovery sideload fallback) ..."
          cd "$GITHUB_WORKSPACE/device_kernel"
          if [[ ! -d Anykernel3 ]]; then
            git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3 --depth=1
          fi
          AK3=Anykernel3/anykernel.sh
          sed -i 's/ExampleKernel by osm0sis @ xda-developers/ReSukiSU+SUSFS redwood crDroid16 by NonGKI/g' "$AK3"
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' "$AK3"
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' "$AK3"
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' "$AK3"
          sed -i 's/device.name1=.*/device.name1=redwood;/' "$AK3"
          sed -i 's/device.name2=.*/device.name2=22101320C;/' "$AK3"
          sed -i 's/kernel.string=.*/kernel.string=ReSukiSU+SUSFS redwood crDroid16;/' "$AK3"
          if grep -q '^PATCH_VBMETA_FLAG=' "$AK3"; then
            sed -i 's/^PATCH_VBMETA_FLAG=.*/PATCH_VBMETA_FLAG=auto;/' "$AK3"
          else
            printf '\nPATCH_VBMETA_FLAG=auto;\n' >> "$AK3"
          fi

          mkdir -p tmp
          if [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz-dtb" tmp/
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp "$IMAGE_DIR/Image.gz" tmp/
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            cp -fp "$IMAGE_DIR/Image" tmp/
          fi
          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            cp -fp "$IMAGE_DIR/dtbo.img" tmp/
          fi
          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp "$IMAGE_DIR/dtb.img" tmp/dtb
          elif [[ -f "$IMAGE_DIR/dtb" ]]; then
            cp -fp "$IMAGE_DIR/dtb" tmp/
          fi
          cp -rp ./Anykernel3/* tmp/
          cd tmp
          7za a -mx9 ak3.zip *
          cd ..
          AK3_ZIP="${{ env.DEVICE_CODENAME }}-${{ env.ROM_TEXT }}-${TIME}-Anykernel3.zip"
          cp -fp tmp/ak3.zip "$GITHUB_WORKSPACE/$AK3_ZIP"
          rm -rf tmp boot_extract payload.bin crdroid.zip pdu.tar.gz payload-dumper-go mkboottools out boot.img
          rm -f "$BOOT_BASE"

          echo "PACK_METHOD=MKBOOTIMG" >> "$GITHUB_ENV"
          echo "PACK_NAME=$OUT_IMG" >> "$GITHUB_ENV"
          echo "AK3_PACK_NAME=$AK3_ZIP" >> "$GITHUB_ENV"
          echo "[OK] Primary artifact: $OUT_IMG"
          echo "[OK] Fallback artifact: $AK3_ZIP"

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files

      - name: Upload AnyKernel3 fallback
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-${{ env.AK3_PACK_NAME }}
          path: ${{ env.AK3_PACK_NAME }}
